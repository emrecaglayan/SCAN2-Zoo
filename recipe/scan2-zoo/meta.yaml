package:
    name: scan2-zoo
    version: "0.1"

build:
    number: 1

requirements:
    run:
      - python >=3.8
      - r-base >=4.2
      - snakemake
      - java-jdk=8
      - mamba
      - gatk=3.8
      - gatk4
      - samtools
      - pysam
      - bedtools
      - htslib
      - bcftools
      - r-scan2.zoo
      - shyaml
      - r-argparse

source:
    git_url: https://github.com/emrecaglayan/SCAN2-Zoo

about:
    home: https://github.com/emrecaglayan/SCAN2-Zoo
    summary: Somatic SNV and indel genotyper for PTA-amplified single cells
